# Builds the plug-in (Windows: VST3; macOS: Audio Unit and VST3) and, for each system, its installer
name: Build D.A LUNE

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      pluginval_seeds:
        description: "Random seeds for pluginval, separated by spaces (empty = the usual two)"
        required: false
        default: ""
      screens_as_text:
        description: "Also put copies of the installer's screenshots on the run page, as text"
        type: boolean
        required: false
        default: false

env:
  # What the plug-in is called: DALUNE_PRODUCT_NAME in CMakeLists.txt. The files are named after it.
  PRODUCT: D.A LUNE
  PLUGINVAL_VERSION: v1.0.4
  # pluginval tries the plug-in with random values; the seed decides which. With 0x3 it hands the
  # Freeze switch a value just below one half, with 0x7 a value near the top of its range.
  PLUGINVAL_SEEDS: ${{ inputs.pluginval_seeds || '0x3 0x7' }}

jobs:
  build-windows:
    name: Windows x64 (VST3 and installer)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build -A x64

      # (MSBUILDDISABLENODEREUSE: no build tools are left running afterwards. They would keep the
      # build folder open, and it is moved aside further down.)
      - name: Build the VST3 and its installer (Release)
        id: build
        env:
          MSBUILDDISABLENODEREUSE: 1
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            bash .github/scripts/annotate.sh "Windows build failed" build.log "error"
            exit 1
          fi

      # The reverb engine on its own: shimmer in tune, tail length, Freeze, garbage input, ...
      - name: Engine checks
        run: bash .github/scripts/run-engine-checks.sh build/checks/CloudveilEngineChecks.exe "Windows x64"

      # (Runs whatever the engine checks said, so that one run reports on everything.)
      - name: Validate VST3 (pluginval)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          7z x -y pluginval.zip > /dev/null
          bash .github/scripts/run-pluginval.sh ./pluginval.exe "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3" "Windows VST3" $PLUGINVAL_SEEDS

      - name: Package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $vst3 = "build\Cloudveil_artefacts\Release\VST3\$env:PRODUCT.vst3"
          $installer = "build\CloudveilInstaller_artefacts\Release\$env:PRODUCT Installer.exe"
          if (-not (Test-Path $vst3)) { throw "VST3 bundle not found at $vst3" }
          if (-not (Test-Path $installer)) { throw "Installer not found at $installer" }
          Compress-Archive -Path $installer -DestinationPath "D.A-LUNE-Windows-Installer.zip" -Force
          Compress-Archive -Path $vst3 -DestinationPath "D.A-LUNE-Windows-x64-VST3.zip" -Force

      # The installer as it reaches somebody: one file, with the plug-in inside it. It is taken
      # out of the zip that is uploaded and put on the Desktop, and the whole build is moved out
      # of its reach. Started there, it goes through itself (drags its window by its frame, moves
      # it, clicks Next, Next, Finish) and so installs into C:\Program Files\Common Files\VST3.
      # The screen is photographed meanwhile: around its frame the window has to be see-through
      # in the photograph. What arrives is compared with what was built.
      - name: Run the installer, on its own on the Desktop
        id: installer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          zip="D.A-LUNE-Windows-Installer.zip"

          # (the names in the zip; 7-Zip may list the zip itself first)
          holds="$(7z l -ba -slt "$zip" | tr -d '\r' | sed -n 's/^Path = //p' | grep -v -x -F "$zip" || true)"
          if [ "$holds" != "$PRODUCT Installer.exe" ]; then
            echo "::error title=The installer's zip does not hold the installer alone::It holds: $holds"
            exit 1
          fi

          desktop="$(cygpath -u "$USERPROFILE")/Desktop"
          mkdir -p "$desktop"
          rm -f "$desktop/$PRODUCT Installer.exe"
          7z x -y "-o$(cygpath -w "$desktop")" "$zip" > /dev/null
          installer="$desktop/$PRODUCT Installer.exe"

          # Windows has to ask for administrator rights before the installer starts: the VST3
          # folder cannot be written to without them.
          if ! grep -a -q "requireAdministrator" "$installer"; then
            echo "::error title=The installer does not ask for administrator rights::Its manifest does not say requireAdministrator."
            exit 1
          fi

          folder="$(cygpath -u "${COMMONPROGRAMFILES:-C:\\Program Files\\Common Files}")/VST3"

          OUT_OF_REACH=build bash .github/scripts/run-installer.sh "$installer" "Windows" installer-pictures \
            "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3=$folder/$PRODUCT.vst3"

      # Only on request: the screenshots as text on the run page (see annotate-picture.sh).
      # The first page in two halves, which leaves it at full size; the others as small copies.
      - name: Screenshot of the welcome page, as text (left half)
        if: ${{ !cancelled() && inputs.screens_as_text && steps.build.outcome == 'success' }}
        run: bash .github/scripts/annotate-picture.sh "Screen - Windows - welcome-left" installer-pictures/screen-welcome-left.png

      - name: Screenshot of the welcome page, as text (right half)
        if: ${{ !cancelled() && inputs.screens_as_text && steps.build.outcome == 'success' }}
        run: bash .github/scripts/annotate-picture.sh "Screen - Windows - welcome-right" installer-pictures/screen-welcome-right.png

      - name: Screenshot of the location page, as text
        if: ${{ !cancelled() && inputs.screens_as_text && steps.build.outcome == 'success' }}
        run: bash .github/scripts/annotate-picture.sh "Screen - Windows - location" installer-pictures/screen-location.png

      - name: Screenshot of the finished page, as text
        if: ${{ !cancelled() && inputs.screens_as_text && steps.build.outcome == 'success' }}
        run: bash .github/scripts/annotate-picture.sh "Screen - Windows - finished" installer-pictures/screen-finished.png

      # The same file on the Desktop once more, this time without its window. It replaces the
      # copy the step above installed.
      - name: Run it once more, without its window
        run: |
          desktop="$(cygpath -u "$USERPROFILE")/Desktop"
          folder="$(cygpath -u "${COMMONPROGRAMFILES:-C:\\Program Files\\Common Files}")/VST3"

          OUT_OF_REACH=build bash .github/scripts/run-installer-silently.sh "$desktop/$PRODUCT Installer.exe" "Windows" \
            "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3=$folder/$PRODUCT.vst3"

      # archive: false uploads a zip as it is, under its own file name. (Without it every job
      # produced an artifact called "artifact", each a zip inside a zip.)
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          path: D.A-LUNE-Windows-Installer.zip
          archive: false
          if-no-files-found: error

      - name: Upload the VST3 on its own
        uses: actions/upload-artifact@v7
        with:
          path: D.A-LUNE-Windows-x64-VST3.zip
          archive: false
          if-no-files-found: error

      # What the installer looked like on this machine: the screen, and each page as it was drawn
      - name: Package the installer's pictures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          if (Test-Path installer-pictures\*.png) {
            Compress-Archive -Path installer-pictures\*.png -DestinationPath "D.A-LUNE-Windows-installer-pictures.zip" -Force
          }

      - name: Upload the installer's pictures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: D.A-LUNE-Windows-installer-pictures.zip
          archive: false
          if-no-files-found: warn

  build-macos:
    name: macOS Universal (AU, VST3 and installer)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake (Universal arm64 + x86_64)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build AU, VST3 and their installer (Release)
        id: build
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            bash .github/scripts/annotate.sh "macOS build failed" build.log "error[: ]"
            exit 1
          fi

      - name: Verify Universal Binaries & Signatures
        run: |
          app="build/CloudveilInstaller_artefacts/Release/$PRODUCT Installer.app"

          for binary in "build/Cloudveil_artefacts/Release/AU/$PRODUCT.component/Contents/MacOS/$PRODUCT" \
                        "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3/Contents/MacOS/$PRODUCT" \
                        "$app/Contents/MacOS/$PRODUCT Installer"; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch arm64 x86_64
          done

          codesign --verify --deep --strict "build/Cloudveil_artefacts/Release/AU/$PRODUCT.component"
          codesign --verify --deep --strict "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3"
          codesign --verify --deep --strict "$app"

          # the plug-ins the installer carries
          unzip -l "$app/Contents/Resources/payload.zip" | tail -n 1

      # The reverb engine on its own, as built for Apple Silicon and (through Rosetta, where
      # the runner has it) as built for Intel
      - name: Engine checks
        run: |
          bash .github/scripts/run-engine-checks.sh build/checks/CloudveilEngineChecks "macOS $(uname -m)"
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            bash .github/scripts/run-engine-checks.sh "arch -x86_64 build/checks/CloudveilEngineChecks" "macOS x86_64 under Rosetta"
          else
            echo "::notice title=Engine checks::No Rosetta on this runner, so the Intel build of the engine was not run."
          fi

      - name: Validate VST3 (pluginval)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q -o pluginval.zip
          bash .github/scripts/run-pluginval.sh pluginval.app/Contents/MacOS/pluginval "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3" "macOS VST3" $PLUGINVAL_SEEDS

      - name: Package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p dist
          cp -R "build/Cloudveil_artefacts/Release/AU/$PRODUCT.component" dist/
          cp -R "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3" dist/
          (cd dist && zip -r -y ../D.A-LUNE-macOS-Universal-AU-VST3.zip "$PRODUCT.component" "$PRODUCT.vst3")
          ditto -c -k --sequesterRsrc --keepParent "build/CloudveilInstaller_artefacts/Release/$PRODUCT Installer.app" D.A-LUNE-macOS-Installer.zip

      # The installer as it reaches somebody: one application, with the plug-ins inside it. It is
      # taken out of the zip that is uploaded and put on the Desktop, and the whole build is moved
      # out of its reach. Started there, it goes through itself (drags its window by its frame,
      # moves it, clicks Next, Next, Finish) and so installs into ~/Library/Audio/Plug-Ins.
      # The screen is photographed meanwhile: around its frame the window has to be see-through
      # in the photograph. What arrives is compared with what was built.
      - name: Run the installer, on its own on the Desktop
        id: installer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          zip="D.A-LUNE-macOS-Installer.zip"

          holds="$(unzip -Z1 "$zip" | cut -d/ -f1 | grep -v '^__MACOSX$' | sort -u)"
          if [ "$holds" != "$PRODUCT Installer.app" ]; then
            echo "::error title=The installer's zip does not hold the installer alone::It holds: $holds"
            exit 1
          fi

          mkdir -p "$HOME/Desktop"
          rm -rf "$HOME/Desktop/$PRODUCT Installer.app"
          ditto -x -k "$zip" "$HOME/Desktop"
          app="$HOME/Desktop/$PRODUCT Installer.app"

          # (unpacked, its signature has to hold, or macOS calls it damaged)
          codesign --verify --deep --strict "$app"

          plugins="$HOME/Library/Audio/Plug-Ins"

          OUT_OF_REACH=build bash .github/scripts/run-installer.sh "$app/Contents/MacOS/$PRODUCT Installer" "macOS" installer-pictures \
            "build/Cloudveil_artefacts/Release/AU/$PRODUCT.component=$plugins/Components/$PRODUCT.component" \
            "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3=$plugins/VST3/$PRODUCT.vst3"

          # a plug-in whose signature did not survive the journey would not load on Apple Silicon
          codesign --verify --deep --strict "$plugins/Components/$PRODUCT.component"
          codesign --verify --deep --strict "$plugins/VST3/$PRODUCT.vst3"

      # Only on request: the screenshots as text on the run page (see annotate-picture.sh).
      # The first page in two halves, which leaves it at full size; the others as small copies.
      - name: Screenshot of the welcome page, as text (left half)
        if: ${{ !cancelled() && inputs.screens_as_text && steps.build.outcome == 'success' }}
        run: bash .github/scripts/annotate-picture.sh "Screen - macOS - welcome-left" installer-pictures/screen-welcome-left.png

      - name: Screenshot of the welcome page, as text (right half)
        if: ${{ !cancelled() && inputs.screens_as_text && steps.build.outcome == 'success' }}
        run: bash .github/scripts/annotate-picture.sh "Screen - macOS - welcome-right" installer-pictures/screen-welcome-right.png

      - name: Screenshot of the location page, as text
        if: ${{ !cancelled() && inputs.screens_as_text && steps.build.outcome == 'success' }}
        run: bash .github/scripts/annotate-picture.sh "Screen - macOS - location" installer-pictures/screen-location.png

      - name: Screenshot of the finished page, as text
        if: ${{ !cancelled() && inputs.screens_as_text && steps.build.outcome == 'success' }}
        run: bash .github/scripts/annotate-picture.sh "Screen - macOS - finished" installer-pictures/screen-finished.png

      # auval is Apple's own validator; Logic and GarageBand only load Audio Units that pass it.
      # It validates the Audio Unit where the installer put it. It runs even when pluginval
      # objected, so that one run reports on both formats.
      # (The artifacts are still only uploaded when every step has passed.)
      - name: Validate AU (auval)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          installed="$HOME/Library/Audio/Plug-Ins/Components/$PRODUCT.component"

          if [ ! -d "$installed" ]; then
            echo "::warning title=auval::The installer did not put the Audio Unit in place, so a copy of the built one is validated."
            mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
            cp -R "build/Cloudveil_artefacts/Release/AU/$PRODUCT.component" "$HOME/Library/Audio/Plug-Ins/Components/"
            killall -9 AudioComponentRegistrar 2>/dev/null || true
          fi

          for attempt in 1 2 3; do
            if auval -v aufx Lune Dapr > auval.log 2>&1; then
              cat auval.log
              bash .github/scripts/annotate.sh "auval passed the Audio Unit" auval.log 'VALIDATION|PASS|FAIL' notice
              exit 0
            fi
            cat auval.log
            echo "auval attempt $attempt failed; waiting for the component to be registered"
            sleep 10
          done
          bash .github/scripts/annotate.sh "auval rejected the Audio Unit" auval.log
          exit 1

      # The same application on the Desktop once more, this time without its window. It replaces
      # the copies the step above installed.
      - name: Run it once more, without its window
        run: |
          plugins="$HOME/Library/Audio/Plug-Ins"

          OUT_OF_REACH=build bash .github/scripts/run-installer-silently.sh "$HOME/Desktop/$PRODUCT Installer.app/Contents/MacOS/$PRODUCT Installer" "macOS" \
            "build/Cloudveil_artefacts/Release/AU/$PRODUCT.component=$plugins/Components/$PRODUCT.component" \
            "build/Cloudveil_artefacts/Release/VST3/$PRODUCT.vst3=$plugins/VST3/$PRODUCT.vst3"

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          path: D.A-LUNE-macOS-Installer.zip
          archive: false
          if-no-files-found: error

      - name: Upload the AU and VST3 on their own
        uses: actions/upload-artifact@v7
        with:
          path: D.A-LUNE-macOS-Universal-AU-VST3.zip
          archive: false
          if-no-files-found: error

      # What the installer looked like on this machine: the screen, and each page as it was drawn
      - name: Package the installer's pictures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ls installer-pictures/*.png > /dev/null 2>&1; then
            (cd installer-pictures && zip -q ../D.A-LUNE-macOS-installer-pictures.zip *.png)
          fi

      - name: Upload the installer's pictures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: D.A-LUNE-macOS-installer-pictures.zip
          archive: false
          if-no-files-found: warn

name: Build Cloudveil Reverb (Windows VST3 & macOS AU/VST3)

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build-windows:
    name: Windows x64 (VST3)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build VST3 (Release)
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            bash .github/scripts/annotate-failure.sh "Windows build failed" build.log "error"
            exit 1
          fi

      # pluginval loads the plug-in the way a host does and exercises it: parameters, state,
      # bus layouts, the editor, odd buffer sizes and sample rates.
      - name: Validate VST3 (pluginval)
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          7z x -y pluginval.zip > /dev/null
          if ! ./pluginval.exe --strictness-level 10 --verbose --validate "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3" 2>&1 | tee pluginval.log; then
            bash .github/scripts/annotate-failure.sh "pluginval rejected the Windows VST3" pluginval.log
            exit 1
          fi

      - name: Package Windows VST3
        shell: pwsh
        run: |
          $vst3Path = "build\Cloudveil_artefacts\Release\VST3\Cloudveil.vst3"
          if (-not (Test-Path $vst3Path)) {
            throw "VST3 bundle not found at $vst3Path"
          }
          Compress-Archive -Path $vst3Path -DestinationPath "Cloudveil-Windows-x64-VST3.zip" -Force

      # archive: false uploads the zip as it is, under its own file name. (Without it both jobs
      # produced an artifact called "artifact", each a zip inside a zip.)
      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v7
        with:
          path: Cloudveil-Windows-x64-VST3.zip
          archive: false
          if-no-files-found: error

  build-macos:
    name: macOS Universal (AU & VST3)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake (Universal arm64 + x86_64)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build AU & VST3 (Release)
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            bash .github/scripts/annotate-failure.sh "macOS build failed" build.log "error[: ]"
            exit 1
          fi

      - name: Verify Universal Binaries & Signatures
        run: |
          lipo -info "build/Cloudveil_artefacts/Release/AU/Cloudveil.component/Contents/MacOS/Cloudveil"
          lipo -info "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3/Contents/MacOS/Cloudveil"
          codesign --verify --deep --strict "build/Cloudveil_artefacts/Release/AU/Cloudveil.component"
          codesign --verify --deep --strict "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3"

      - name: Validate VST3 (pluginval)
        run: |
          set -o pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q -o pluginval.zip
          if ! pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --verbose --validate "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3" 2>&1 | tee pluginval.log; then
            bash .github/scripts/annotate-failure.sh "pluginval rejected the macOS VST3" pluginval.log
            exit 1
          fi

      # auval is Apple's own validator; Logic and GarageBand only load Audio Units that pass it.
      - name: Validate AU (auval)
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "build/Cloudveil_artefacts/Release/AU/Cloudveil.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for attempt in 1 2 3; do
            if auval -v aufx Clvr Clvd > auval.log 2>&1; then cat auval.log; exit 0; fi
            cat auval.log
            echo "auval attempt $attempt failed; waiting for the component to be registered"
            sleep 10
          done
          bash .github/scripts/annotate-failure.sh "auval rejected the Audio Unit" auval.log
          exit 1

      - name: Package macOS AU & VST3
        run: |
          mkdir -p dist
          cp -R "build/Cloudveil_artefacts/Release/AU/Cloudveil.component" dist/
          cp -R "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3" dist/
          (cd dist && zip -r -y ../Cloudveil-macOS-Universal-AU-VST3.zip Cloudveil.component Cloudveil.vst3)

      - name: Upload macOS AU & VST3 Artifact
        uses: actions/upload-artifact@v7
        with:
          path: Cloudveil-macOS-Universal-AU-VST3.zip
          archive: false
          if-no-files-found: error

name: Build Cloudveil Reverb (Windows VST3 & macOS AU/VST3)

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      pluginval_seeds:
        description: "Random seeds for pluginval, separated by spaces (empty = the usual two)"
        required: false
        default: ""

env:
  PLUGINVAL_VERSION: v1.0.4
  # pluginval tries the plug-in with random values; the seed decides which. With 0x3 it hands the
  # Freeze switch a value just below one half, with 0x7 a value near the top of its range.
  PLUGINVAL_SEEDS: ${{ inputs.pluginval_seeds || '0x3 0x7' }}

jobs:
  build-windows:
    name: Windows x64 (VST3)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build VST3 (Release)
        id: build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            bash .github/scripts/annotate.sh "Windows build failed" build.log "error"
            exit 1
          fi

      # The reverb engine on its own: shimmer in tune, tail length, Freeze, garbage input, ...
      - name: Engine checks
        shell: bash
        run: bash .github/scripts/run-engine-checks.sh build/checks/CloudveilEngineChecks.exe "Windows x64"

      # (Runs whatever the engine checks said, so that one run reports on everything.)
      - name: Validate VST3 (pluginval)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          7z x -y pluginval.zip > /dev/null
          bash .github/scripts/run-pluginval.sh ./pluginval.exe "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3" "Windows VST3" $PLUGINVAL_SEEDS

      - name: Package Windows VST3
        shell: pwsh
        run: |
          $vst3Path = "build\Cloudveil_artefacts\Release\VST3\Cloudveil.vst3"
          if (-not (Test-Path $vst3Path)) {
            throw "VST3 bundle not found at $vst3Path"
          }
          Compress-Archive -Path $vst3Path -DestinationPath "Cloudveil-Windows-x64-VST3.zip" -Force

      # archive: false uploads the zip as it is, under its own file name. (Without it both jobs
      # produced an artifact called "artifact", each a zip inside a zip.)
      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v7
        with:
          path: Cloudveil-Windows-x64-VST3.zip
          archive: false
          if-no-files-found: error

  build-macos:
    name: macOS Universal (AU & VST3)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake (Universal arm64 + x86_64)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build AU & VST3 (Release)
        id: build
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 2>&1 | tee build.log; then
            bash .github/scripts/annotate.sh "macOS build failed" build.log "error[: ]"
            exit 1
          fi

      - name: Verify Universal Binaries & Signatures
        run: |
          lipo -info "build/Cloudveil_artefacts/Release/AU/Cloudveil.component/Contents/MacOS/Cloudveil"
          lipo -info "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3/Contents/MacOS/Cloudveil"
          codesign --verify --deep --strict "build/Cloudveil_artefacts/Release/AU/Cloudveil.component"
          codesign --verify --deep --strict "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3"

      # The reverb engine on its own, as built for Apple Silicon and (through Rosetta, where
      # the runner has it) as built for Intel
      - name: Engine checks
        run: |
          bash .github/scripts/run-engine-checks.sh build/checks/CloudveilEngineChecks "macOS, $(uname -m)"
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            bash .github/scripts/run-engine-checks.sh "arch -x86_64 build/checks/CloudveilEngineChecks" "macOS, x86_64 under Rosetta"
          else
            echo "::notice title=Engine checks::No Rosetta on this runner, so the Intel build of the engine was not run."
          fi

      - name: Validate VST3 (pluginval)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q -o pluginval.zip
          bash .github/scripts/run-pluginval.sh pluginval.app/Contents/MacOS/pluginval "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3" "macOS VST3" $PLUGINVAL_SEEDS

      # auval is Apple's own validator; Logic and GarageBand only load Audio Units that pass it.
      # It runs even when pluginval objected, so that one run reports on both formats.
      # (The artifacts are still only packaged and uploaded when every step has passed.)
      - name: Validate AU (auval)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "build/Cloudveil_artefacts/Release/AU/Cloudveil.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for attempt in 1 2 3; do
            if auval -v aufx Clvr Clvd > auval.log 2>&1; then
              cat auval.log
              bash .github/scripts/annotate.sh "auval passed the Audio Unit" auval.log 'VALIDATION|PASS|FAIL' notice
              exit 0
            fi
            cat auval.log
            echo "auval attempt $attempt failed; waiting for the component to be registered"
            sleep 10
          done
          bash .github/scripts/annotate.sh "auval rejected the Audio Unit" auval.log
          exit 1

      - name: Package macOS AU & VST3
        run: |
          mkdir -p dist
          cp -R "build/Cloudveil_artefacts/Release/AU/Cloudveil.component" dist/
          cp -R "build/Cloudveil_artefacts/Release/VST3/Cloudveil.vst3" dist/
          (cd dist && zip -r -y ../Cloudveil-macOS-Universal-AU-VST3.zip Cloudveil.component Cloudveil.vst3)

      - name: Upload macOS AU & VST3 Artifact
        uses: actions/upload-artifact@v7
        with:
          path: Cloudveil-macOS-Universal-AU-VST3.zip
          archive: false
          if-no-files-found: error
